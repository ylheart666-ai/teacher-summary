<body>
<header class="masthead"><div class="head-inner"><div><p class="eyebrow">先判条件，再做计算 · 教师工具</p><h1>先判后算 · 班级学情汇总（教师端）</h1><p class="head-note">粘贴课件汇总行，核对全班错因与判断习惯。</p></div><span class="version">T7 · 离线可用</span></div></header>
<main>
<section id="input-panel" class="panel input-panel" aria-labelledby="input-title"><div class="input-head"><span class="step">01 / 收集</span><h2 id="input-title"><label for="source">粘贴学生汇总行</label></h2><button id="edit-input" aria-controls="source" aria-expanded="true" hidden>展开输入</button></div><textarea id="source" spellcheck="false" autocomplete="off" placeholder="把学生交来的汇总行粘贴到这里，可以一次粘贴多名学生、多轮记录，夹杂其他文字也没关系。"></textarea><div class="input-actions"><div class="buttons"><button id="analyze" class="primary">开始汇总</button><button id="sample">载入示例数据</button><button id="clear">清空</button></div><p class="privacy">数据只在本页面内处理，不上传、不保存，关闭页面即清除。</p></div><p id="input-status" class="live-status" role="status" aria-live="polite"></p></section>
<div id="intro" class="empty-start"><strong>从一行记录，看见全班的判断习惯</strong><span>支持最值与洛必达课件 · 多轮记录按学生归并 · 固定规则统计，结果可核对</span></div>
<section id="results" hidden aria-label="班级汇总结果"><div class="result-head"><span class="step">02 / 学情</span><h2>班级学情</h2><span id="demo-badge" class="demo-badge" hidden>当前为示例数据，非真实学情</span></div><p id="stale" class="pending" hidden>输入内容已修改，请点击“开始汇总”更新结果。</p><div class="tabs" role="tablist" aria-label="汇总模块"><button class="tab" id="tab-extremum" role="tab" aria-selected="true" aria-controls="module-panel" data-tab="extremum">最值判断</button><button class="tab" id="tab-lhopital" role="tab" aria-selected="false" aria-controls="module-panel" data-tab="lhopital" tabindex="-1">洛必达法则</button><button class="tab" id="tab-cross" role="tab" aria-selected="false" aria-controls="module-panel" data-tab="cross" tabindex="-1">学生总览（两模块）</button></div><div id="module-panel" role="tabpanel" aria-labelledby="tab-extremum"></div></section>
<footer class="footer"><span>学生端练判断，教师端看错因。</span><span>按规则统计 · 不联网 · 不保存输入数据</span></footer>
</main>
<noscript>请启用浏览器 JavaScript 以在本地解析汇总行。页面不上传数据。</noscript>
<script>
/* T7 statistics engine: pure, deterministic, and independent of the DOM. */
(function (root) {
  'use strict';

  const MODULES = { extremum: '最值判断', lhopital: '洛必达法则' };
  const CASES = Object.freeze({
    wire: '铁丝分割：围成面积最大',
    reservoir: '蓄水池调度：水位最低时刻',
    trail: '骑行线路：海拔最低点',
    transport: '工程选址：运费最省',
    // Copied verbatim from the frozen extremum CASES source.
    container: '开口容器：容积最大',
    cylinder: '有盖圆柱仓库：用料最省',
    'exp-basic': '基础正例：先检验，再使用',
    'not-indet': '类型检验：确定值不能误用',
    xlnx: '先变形：把乘积写成分式',
    recheck: '连续使用：每步再检验',
    'x-sinx': '失效后回退：不能反推'
  });
  const ERRORS = Object.freeze([
    { module: 'extremum', tag: 'endpoint-omission', label: '端点遗漏', node: 'A', caseId: 'wire' },
    { module: 'extremum', tag: 'derivative-filter', label: '导数筛选', node: '②', caseId: 'container' },
    { module: 'extremum', tag: 'non-differentiable', label: '不可导点', node: 'B', caseId: 'reservoir' },
    { module: 'extremum', tag: 'flexible-overgeneralization', label: '灵活判断过度泛化', node: 'C', caseId: 'trail' },
    { module: 'extremum', tag: 'condition-awareness', label: '条件意识', node: 'A、B、C', caseId: 'wire' },
    { module: 'extremum', tag: 'procedure-fragmentation', label: '程序碎片化', node: '①②④', caseId: 'container' },
    { module: 'extremum', tag: 'comparison-error', label: '比较错误', node: '④', caseId: 'container' },
    { module: 'lhopital', tag: 'lh-type-check', label: '类型检验', node: 'N1', caseId: 'not-indet' },
    { module: 'lhopital', tag: 'lh-transform', label: '变形', node: 'N3', caseId: 'xlnx' },
    { module: 'lhopital', tag: 'lh-recheck', label: '每步再检验', node: 'N4', caseId: 'recheck' },
    { module: 'lhopital', tag: 'lh-reverse-inference', label: '失效回退', node: 'R', caseId: 'x-sinx' }
  ]);
  const NODES = Object.freeze({
    extremum: [
      { id: '1', label: '最值存在性' }, { id: '2', label: '候选点识别' },
      { id: '4', label: '候选值比较' }, { id: 'A', label: '端点排除' },
      { id: 'B', label: '可导性判断' }, { id: 'C', label: '驻点唯一性' }
    ],
    lhopital: [
      { id: 'N1', label: '识别类型' }, { id: 'N2', label: '验证条件' },
      { id: 'N3', label: '决策' }, { id: 'N4', label: '再检验' },
      { id: 'R', label: '失效回退' }
    ]
  });
  const TRAPS = Object.freeze([
    { caseId: 'not-indet', node: 'N3', meaning: '不是未定式，仍用法则', type: '误用法则' },
    { caseId: 'xlnx', node: 'N3', meaning: '0·∞ 型没变形，直接求导', type: '误用法则' },
    { caseId: 'recheck', node: 'N4', meaning: '用完一次不再检验，接着用法则', type: '误用法则' },
    { caseId: 'x-sinx', node: 'R', meaning: '导数比没有极限，就断定原极限不存在', type: '错误反推' }
  ]);

  const own = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const sum = (items, key) => items.reduce((value, item) => value + item[key], 0);
  const percent = (value, total) => total ? Math.round(value / total * 100) : 0;
  const label = tag => {
    const entry = ERRORS.find(item => item.tag === tag);
    return entry ? entry.label : tag;
  };
  const nodeLabel = (module, id) => {
    const entry = (NODES[module] || []).find(item => item.id === id);
    return entry ? entry.label : id;
  };
  const caseLabel = id => own(CASES, id) ? CASES[id] : id;

  function parseScore(value) {
    const match = String(value || '').match(/^(\d+)\s*\/\s*(\d+)$/);
    if (!match) return null;
    const correct = Number(match[1]);
    const total = Number(match[2]);
    if (!Number.isSafeInteger(correct) || !Number.isSafeInteger(total) || total <= 0 || correct > total) return null;
    return { correct, total };
  }

  function parseTags(value) {
    return [...new Set(String(value || '').split(',').map(tag => tag.trim())
      .filter(tag => tag && tag !== '-' && tag !== '无'))];
  }

  function parsePairs(value) {
    const pairs = Object.create(null);
    String(value || '').split(',').forEach(part => {
      const separator = part.indexOf(':');
      if (separator < 0) return;
      const key = part.slice(0, separator).trim();
      if (key) pairs[key] = part.slice(separator + 1).trim();
    });
    return pairs;
  }

  function nonnegativeInteger(value, fallback) {
    const text = String(value === undefined ? '' : value).trim();
    if (!/^\d+$/.test(text)) return fallback;
    const result = Number(text);
    return Number.isSafeInteger(result) ? result : fallback;
  }

  function parse(text) {
    text = String(text || '');
    const records = [];
    const invalid = [];
    const seen = new Set();
    const duplicateByModule = { extremum: 0, lhopital: 0 };
    const regex = /【汇总行】v1\|[^\n\r]+/g;
    let duplicates = 0;
    let anonymousCount = 0;
    let extractedCount = 0;
    let cursor = 0;
    let lineNumber = 1;
    let match;
    while ((match = regex.exec(text))) {
      extractedCount += 1;
      lineNumber += (text.slice(cursor, match.index).match(/\r\n|\r|\n/g) || []).length;
      cursor = match.index;
      const raw = match[0];
      const fields = Object.create(null);
      raw.split('|').slice(1).forEach(part => {
        const separator = part.indexOf('=');
        if (separator < 0) return;
        const key = part.slice(0, separator).trim();
        if (key) fields[key] = part.slice(separator + 1).trim();
      });
      const module = fields['模块'] || '';
      if (seen.has(raw)) {
        duplicates += 1;
        if (own(duplicateByModule, module)) duplicateByModule[module] += 1;
        continue;
      }
      seen.add(raw);
      const reasons = ['模块', '前测', '节点', '后测'].filter(key => !own(fields, key))
        .map(key => '缺少' + key + '字段');
      if (own(fields, '模块') && !own(MODULES, module)) reasons.push('模块必须为 extremum 或 lhopital');
      if (reasons.length) {
        invalid.push({ lineNumber, reason: reasons.join('；'), raw, module });
        continue;
      }
      const originalName = (fields['学生'] || '').trim();
      const anonymous = !originalName;
      if (anonymous) anonymousCount += 1;
      const name = originalName || '未署名 ' + anonymousCount;
      const nodes = parsePairs(fields['节点']);
      const flexible = parsePairs(fields['灵活']);
      records.push({
        raw, lineNumber, fields, module, name, originalName, anonymous,
        studentId: anonymous ? module + ':anonymous:' + records.length : module + ':name:' + name,
        session: fields['会话'] || '-', mode: fields['模式'] || '-',
        caseId: fields['案例'] || '-', path: fields['路径'] || '-',
        pre: fields['前测'], post: fields['后测'],
        preScore: parseScore(fields['前测']), postScore: parseScore(fields['后测']),
        errors: parseTags(fields['前测错因']), diagnosis: parseTags(fields['诊断']),
        nodes, flexible,
        releaseErrors: module === 'extremum' ? nonnegativeInteger(fields['误放行'], Object.values(flexible).filter(value => value === '误放行').length) : 0,
        conservative: module === 'extremum' ? nonnegativeInteger(fields['保守回退'], Object.values(flexible).filter(value => value === '保守回退').length) : 0,
        hasTrapField: own(fields, '陷阱误选'), trapValue: fields['陷阱误选'],
        duration: fields['用时'] || '-'
      });
    }
    return { records, invalid, duplicates, anonymousCount, extractedCount, duplicateByModule };
  }

  function trapResult(record) {
    const trap = TRAPS.find(item => item.caseId === record.caseId);
    const result = { errors: 0, clean: 0, legacyIndependent: 0, legacyNotIndependent: 0, legacyRecords: 0 };
    if (record.module !== 'lhopital' || !trap) return result;
    if (record.hasTrapField) {
      result.errors = record.trapValue === '1' ? 1 : 0;
      result.clean = record.trapValue === '0' ? 1 : 0;
    } else {
      result.legacyRecords = 1;
      const state = record.nodes[trap.node];
      result.legacyIndependent = state === '独' ? 1 : 0;
      result.legacyNotIndependent = state === '提' || state === '巩' ? 1 : 0;
    }
    return result;
  }

  function trapDisplay(student) {
    if (!student.legacyRecords) return String(student.trapErrors);
    const inferred = '未独立 ' + student.legacyNotIndependent + '（推算）';
    const directRounds = student.records.filter(record => record.hasTrapField && TRAPS.some(trap => trap.caseId === record.caseId)).length;
    return directRounds ? student.trapErrors + '；' + inferred : inferred;
  }

  function mergeStudents(records) {
    const groups = new Map();
    records.forEach(record => {
      if (!groups.has(record.studentId)) groups.set(record.studentId, []);
      groups.get(record.studentId).push(record);
    });
    return [...groups.entries()].map(([id, rounds]) => {
      const first = rounds[0];
      const preRecord = rounds.find(record => record.pre !== '跳过');
      const postRecord = [...rounds].reverse().find(record => record.post !== '-');
      const weakNodes = [...new Set(rounds.flatMap(record => Object.keys(record.nodes).filter(node => record.nodes[node] === '巩')))];
      const orderedNodes = (NODES[first.module] || []).map(node => node.id);
      weakNodes.sort((a, b) => {
        const aIndex = orderedNodes.indexOf(a);
        const bIndex = orderedNodes.indexOf(b);
        return (aIndex < 0 ? orderedNodes.length : aIndex) - (bIndex < 0 ? orderedNodes.length : bIndex);
      });
      const traps = rounds.map(trapResult);
      const errors = preRecord ? preRecord.errors.slice() : [];
      const preScore = preRecord ? preRecord.preScore : null;
      const postScore = postRecord ? postRecord.postScore : null;
      let canCalculateCannotJudge = null;
      if (first.module === 'lhopital' && preScore && preScore.total === 7) {
        canCalculateCannotJudge = errors.length > 0 && (7 - preScore.correct) - errors.length === 0;
      }
      const student = {
        id, name: first.name, anonymous: first.anonymous, module: first.module,
        records: rounds, rounds: rounds.length,
        pre: preRecord ? preRecord.pre || '-' : '-', post: postRecord ? postRecord.post || '-' : '-',
        preScore, postScore, errors, errorNames: errors.map(label), weakNodes,
        weakNodeNames: weakNodes.map(node => nodeLabel(first.module, node)),
        releaseErrors: sum(rounds, 'releaseErrors'), conservative: sum(rounds, 'conservative'),
        trapErrors: sum(traps, 'errors'), trapClean: sum(traps, 'clean'),
        legacyIndependent: sum(traps, 'legacyIndependent'), legacyNotIndependent: sum(traps, 'legacyNotIndependent'),
        legacyRecords: sum(traps, 'legacyRecords'), canCalculateCannotJudge
      };
      student.trapDisplay = trapDisplay(student);
      student.attention = Boolean((postScore && postScore.correct < postScore.total) || weakNodes.length || student.releaseErrors || student.trapErrors || student.legacyNotIndependent);
      return student;
    });
  }

  function aggregateScores(students, key) {
    const scores = students.map(student => student[key]).filter(Boolean);
    const correct = sum(scores, 'correct');
    const total = sum(scores, 'total');
    return { correct, total, students: scores.length, rate: total ? Math.round(correct / total * 100) : null };
  }

  function distribution(students, module) {
    const counts = new Map();
    students.forEach(student => student.errors.forEach(tag => counts.set(tag, (counts.get(tag) || 0) + 1)));
    const configured = ERRORS.filter(error => error.module === module);
    const order = configured.map(error => error.tag);
    return [...counts.entries()].map(([tag, count]) => {
      const definition = configured.find(error => error.tag === tag);
      return {
        tag, label: label(tag), node: definition ? definition.node : '',
        caseId: definition ? definition.caseId : '', caseName: definition ? caseLabel(definition.caseId) : '',
        count, percent: percent(count, students.length)
      };
    }).sort((a, b) => {
      if (a.count !== b.count) return b.count - a.count;
      const aIndex = order.indexOf(a.tag);
      const bIndex = order.indexOf(b.tag);
      return (aIndex < 0 ? order.length : aIndex) - (bIndex < 0 ? order.length : bIndex);
    });
  }

  function suggestions(module) {
    if (module.studentCount < 3) return ['记录较少，建议收集更多学生的汇总行后再看分布。'];
    const result = [];
    const top = module.distribution[0];
    if (top && top.count) {
      result.push(top.caseId
        ? '建议课堂重点讲评：' + top.label + '（' + top.count + ' 人）。可用教师演示模式打开课件案例「' + top.caseName + '」讲解对应节点 ' + top.node + '。'
        : '建议课堂重点讲评：' + top.label + '（' + top.count + ' 人）。该标签尚无预设案例，请结合学习记录核对。');
    }
    const weakest = module.nodeStats.reduce((best, node) => !best || node.consolidate > best.consolidate ? node : best, null);
    if (weakest && weakest.consolidate > 0) result.push('训练中最常需要巩固的步骤：' + weakest.label + '（' + weakest.consolidate + ' 人次）。');
    if (module.id === 'extremum' && module.releaseErrors > 0) {
      const worst = module.flexibleStats.reduce((best, node) => !best || node.releaseErrors > best.releaseErrors ? node : best, null);
      result.push('共有 ' + module.releaseErrors + ' 人次在条件不成立时直接下结论，' + (worst && worst.releaseErrors ? '集中在节点 ' + worst.id : '节点分布请核对原始记录') + '。');
    }
    if (module.id === 'lhopital' && module.trapErrors > 0) {
      const worst = module.trapStats.reduce((best, trap) => !best || trap.errors > best.errors ? trap : best, null);
      result.push('共有 ' + module.trapErrors + ' 人次在陷阱节点第一次就走了错路，最多出现在案例「' + worst.caseName + '」（' + worst.meaning + '）。');
    }
    return result.length ? result : ['当前记录中未发现集中的前测错因或需要巩固的节点，可结合课堂表现安排讲评。'];
  }

  function summarizeModule(records, id) {
    const students = mergeStudents(records);
    const nodeStats = NODES[id].map(node => {
      let independent = 0;
      let hinted = 0;
      let consolidate = 0;
      records.forEach(record => {
        independent += record.nodes[node.id] === '独' ? 1 : 0;
        hinted += record.nodes[node.id] === '提' ? 1 : 0;
        consolidate += record.nodes[node.id] === '巩' ? 1 : 0;
      });
      return { ...node, independent, hinted, consolidate, total: independent + hinted + consolidate };
    });
    const flexibleStats = ['A', 'B', 'C'].map(node => ({
      id: node, label: nodeLabel('extremum', node),
      releaseErrors: records.filter(record => record.flexible[node] === '误放行').length,
      conservative: records.filter(record => record.flexible[node] === '保守回退').length
    }));
    const trapStats = TRAPS.map(trap => {
      const caseRecords = records.filter(record => record.caseId === trap.caseId);
      const outcomes = caseRecords.map(trapResult);
      return {
        ...trap, caseName: caseLabel(trap.caseId), nodeLabel: nodeLabel('lhopital', trap.node),
        practice: caseRecords.length, errors: sum(outcomes, 'errors'), clean: sum(outcomes, 'clean'),
        legacyIndependent: sum(outcomes, 'legacyIndependent'), legacyNotIndependent: sum(outcomes, 'legacyNotIndependent'),
        legacyRecords: sum(outcomes, 'legacyRecords')
      };
    });
    const canCalculateCannotJudge = students.filter(student => student.canCalculateCannotJudge === true).length;
    const eligibleCount = students.filter(student => student.canCalculateCannotJudge !== null).length;
    const model = {
      id, label: MODULES[id], records, students, studentCount: students.length, rounds: records.length,
      autonomous: records.filter(record => record.mode === '自主').length,
      collaborative: records.filter(record => record.mode === '协作').length,
      anonymousCount: records.filter(record => record.anonymous).length,
      pre: aggregateScores(students, 'preScore'), post: aggregateScores(students, 'postScore'),
      distribution: distribution(students, id), nodeStats,
      flexibleStats: id === 'extremum' ? flexibleStats : [], trapStats: id === 'lhopital' ? trapStats : [],
      releaseErrors: sum(students, 'releaseErrors'), conservative: sum(students, 'conservative'),
      trapErrors: sum(students, 'trapErrors'), trapClean: sum(students, 'trapClean'),
      legacyIndependent: sum(students, 'legacyIndependent'), legacyNotIndependent: sum(students, 'legacyNotIndependent'),
      legacyRecords: sum(students, 'legacyRecords'), canCalculateCannotJudge,
      canCalculatePercent: percent(canCalculateCannotJudge, students.length), eligibleCount,
      excludedCount: students.length - eligibleCount, attention: students.filter(student => student.attention)
    };
    model.suggestions = suggestions(model);
    return model;
  }

  function summarizeCross(modules) {
    const groups = new Map();
    ['extremum', 'lhopital'].forEach(module => modules[module].students.forEach(student => {
      const key = student.anonymous ? student.id : 'name:' + student.name;
      if (!groups.has(key)) groups.set(key, { id: key, name: student.name, extremum: null, lhopital: null, bothIssue: false });
      groups.get(key)[module] = student;
    }));
    const students = [...groups.values()].map(student => {
      const extremumIssue = student.extremum && (student.extremum.errors.length > 0 || student.extremum.releaseErrors > 0);
      const lhopitalIssue = student.lhopital && (student.lhopital.canCalculateCannotJudge === true || student.lhopital.trapErrors > 0 || student.lhopital.legacyNotIndependent > 0);
      return { ...student, bothIssue: Boolean(extremumIssue && lhopitalIssue) };
    });
    return {
      students, both: students.filter(student => student.extremum && student.lhopital).length,
      onlyExtremum: students.filter(student => student.extremum && !student.lhopital).length,
      onlyLhopital: students.filter(student => !student.extremum && student.lhopital).length,
      bothIssue: students.filter(student => student.bothIssue).length
    };
  }

  function analyze(text) {
    const parsed = parse(text);
    const modules = {
      extremum: summarizeModule(parsed.records.filter(record => record.module === 'extremum'), 'extremum'),
      lhopital: summarizeModule(parsed.records.filter(record => record.module === 'lhopital'), 'lhopital')
    };
    return { parsed, modules, cross: summarizeCross(modules) };
  }

  function csv(headers, rows) {
    // Prevent spreadsheet formula execution while preserving ordinary missing-value dashes.
    const quote = value => {
      let text = value === null || value === undefined ? '' : String(value);
      if (text !== '-' && /^[\s]*[=+@-]/.test(text)) text = "'" + text;
      return '"' + text.replace(/"/g, '""') + '"';
    };
    return '\uFEFF' + [headers, ...rows].map(row => row.map(quote).join(',')).join('\r\n');
  }

  function moduleCSV(module, students) {
    const isLhopital = module.id === 'lhopital';
    const headers = ['学生', '前测', '前测错因', '后测', '需要巩固的节点', isLhopital ? '陷阱误选次数' : '误放行次数', '练习轮次'];
    if (isLhopital) headers.push('旧版未独立推算次数');
    const rows = (students || module.students).map(student => {
      const row = [student.name, student.pre, student.errorNames.join('、') || '无', student.post,
        student.weakNodes.map(node => node + ' · ' + nodeLabel(module.id, node)).join('、') || '无',
        isLhopital ? student.trapErrors : student.releaseErrors, student.rounds];
      if (isLhopital) row.push(student.legacyNotIndependent);
      return row;
    });
    return csv(headers, rows);
  }

  function crossCSV(cross, students) {
    const headers = ['学生', '最值·前测', '最值·前测错因', '最值·后测', '最值·需巩固节点',
      '洛必达·前测', '洛必达·会算不会判', '洛必达·前测错因', '洛必达·后测',
      '条件误判·最值误放行', '条件误判·洛必达陷阱误选', '两模块都有条件判断问题'];
    const rows = (students || cross.students).map(student => {
      const e = student.extremum;
      const l = student.lhopital;
      return [student.name,
        e ? e.pre : '未完成', e ? e.errorNames.join('、') || '无' : '未完成', e ? e.post : '未完成', e ? e.weakNodeNames.join('、') || '无' : '未完成',
        l ? l.pre : '未完成', l ? l.canCalculateCannotJudge === null ? '不计入' : l.canCalculateCannotJudge ? '是' : '否' : '未完成',
        l ? l.errorNames.join('、') || '无' : '未完成', l ? l.post : '未完成',
        e ? e.releaseErrors : '未完成', l ? l.trapDisplay : '未完成', student.bothIssue ? '是' : '否'];
    });
    return csv(headers, rows);
  }

  function summaryText(module) {
    const rate = score => score.rate === null ? '暂无' : score.rate + '%（' + score.correct + '/' + score.total + '，' + score.students + ' 人）';
    const lines = ['先判后算 · 班级学情汇总（教师端）', module.label,
      '学生 ' + module.studentCount + ' 人；练习 ' + module.rounds + ' 轮（自主 ' + module.autonomous + ' 轮／协作 ' + module.collaborative + ' 轮）',
      '前测正确率：' + rate(module.pre), '后测正确率：' + rate(module.post), '前测与后测题目不同，正确率分别展示。'];
    if (module.id === 'lhopital') {
      lines.push('会算不会判：' + module.canCalculateCannotJudge + ' 人（占本模块学生 ' + module.canCalculatePercent + '%）；有 7 题有效前测 ' + module.eligibleCount + ' 人，其余 ' + module.excludedCount + ' 人不计入此项。');
    }
    lines.push('', '前测错因分布（每名学生首条非跳过的前测；百分比以本模块学生人数为分母）：');
    if (!module.distribution.length) lines.push('暂无前测错因。');
    module.distribution.forEach(item => lines.push(item.label + ' · ' + item.count + ' 人 · ' + item.percent + '%'));
    if (module.id === 'extremum') {
      lines.push('', '条件误判：误放行 ' + module.releaseErrors + ' 人次；保守回退 ' + module.conservative + ' 人次（不计错）。');
      module.flexibleStats.forEach(item => lines.push(item.id + ' · ' + item.label + '：误放行 ' + item.releaseErrors + ' 人次／保守回退 ' + item.conservative + ' 人次'));
    } else {
      lines.push('', '陷阱误选 ' + module.trapErrors + ' 人次；陷阱节点未误选 ' + module.trapClean + ' 人次。');
      module.trapStats.forEach(item => lines.push(item.caseName + '｜' + item.node + ' · ' + item.nodeLabel + '｜' + item.meaning + '｜练习 ' + item.practice + ' 人次｜陷阱误选 ' + item.errors + '｜未误选 ' + item.clean));
      if (module.legacyRecords) lines.push('旧版推算：陷阱节点独立判断正确 ' + module.legacyIndependent + ' 人次；陷阱节点未能独立判断 ' + module.legacyNotIndependent + ' 人次。其中 ' + module.legacyRecords + ' 条为旧版记录，只能推算“陷阱节点未能独立判断”，不等于陷阱误选。');
    }
    lines.push('', '讲评建议：', ...module.suggestions);
    return lines.join('\n');
  }

  root.TeacherSummary = Object.freeze({
    analyze, parse, parseScore, parseTags, parsePairs, mergeStudents, summarizeModule, summarizeCross,
    csv, moduleCSV, crossCSV, summaryText, label, nodeLabel, caseLabel,
    MODULES, ERRORS, NODES, CASES, TRAPS
  });
})(typeof window === 'object' ? window : globalThis);

function trapCell(s){const td=cell('');if(!s){td.textContent='未完成';return td;}if(s.legacyRecords){const marker=s.trapDisplay.indexOf('未独立');td.append(document.createTextNode(s.trapDisplay.slice(0,marker)));td.append(el('span','legacy',s.trapDisplay.slice(marker)));}else td.textContent=s.trapErrors;return td;}
function crossValue(s,module,fn,empty='未完成'){return s[module]?fn(s[module]):empty;}
function crossRows(){return sorted(model.cross.students.filter(s=>!onlyIssues||s.bothIssue),{name:s=>s.name,ePre:s=>crossValue(s,'extremum',x=>scoreValue(x.pre),-1),eErrors:s=>crossValue(s,'extremum',x=>join(x.errorNames)),ePost:s=>crossValue(s,'extremum',x=>scoreValue(x.post),-1),eWeak:s=>crossValue(s,'extremum',x=>join(x.weakNodeNames)),lPre:s=>crossValue(s,'lhopital',x=>scoreValue(x.pre),-1),lCan:s=>crossValue(s,'lhopital',x=>x.canCalculateCannotJudge===true?1:x.canCalculateCannotJudge===false?0:-1,-1),lErrors:s=>crossValue(s,'lhopital',x=>join(x.errorNames)),lPost:s=>crossValue(s,'lhopital',x=>scoreValue(x.post),-1),eIssue:s=>crossValue(s,'extremum',x=>x.releaseErrors,-1),lIssue:s=>crossValue(s,'lhopital',x=>x.trapErrors,-1),both:s=>s.bothIssue?1:0},sorts.cross);}
function renderCross(){const parent=$('module-panel'),cross=model.cross;parent.append(el('div','notice','按姓名或学号完全一致匹配，请提醒学生两个课件填写同一学号。'));const metrics=el('div','metrics cross-top');add(metrics,card('两模块都完成',cross.both,'人'),card('只完成最值',cross.onlyExtremum,'人'),card('只完成洛必达',cross.onlyLhopital,'人'));parent.append(metrics);const focus=el('div','spotlight');add(focus,el('strong','',`两个模块都出现条件判断问题：${cross.bothIssue} 人`),el('p','','最值前测有错因或训练中有误放行，并且洛必达属于“会算不会判”或有陷阱误选（旧版记录按陷阱节点未能独立判断）。'),el('p','','同一类“不先判条件”的问题在两个知识点上反复出现，建议统一强调先检验条件的习惯。'));if(!cross.both)focus.append(el('p','','暂无两模块都完成的学生'));parent.append(focus);
 const c=section('跨模块明细表','点击任一列表头排序'),controls=el('div','controls'),label=el('label'),checkbox=el('input');checkbox.type='checkbox';checkbox.checked=onlyIssues;checkbox.id='cross-filter';checkbox.addEventListener('change',()=>{onlyIssues=checkbox.checked;render();});add(label,checkbox,document.createTextNode(' 只看两模块都有问题的学生'));controls.append(label,el('span','note',`显示 ${crossRows().length}／${cross.students.length} 人`));c.querySelector('.section-head').append(controls);c.append(el('p','cross-note','条件误判：都是课件记录的学生第一次在条件判断节点上走错路的次数；两个模块错误类型不同，不相加。旧版推算单独标注。'));
 const columns=[['学生','name'],['前测','ePre'],['前测错因','eErrors'],['后测','ePost'],['需巩固节点','eWeak'],['前测','lPre'],['会算不会判','lCan'],['前测错因','lErrors'],['后测','lPost'],['最值·误放行','eIssue'],['洛必达·陷阱误选','lIssue'],['两模块都有问题','both']];
 const tableWrap=createTable(columns.map(([n,k])=>sortHead(n,k,'cross')),crossRows(),s=>{const tr=el('tr');tr.dataset.issue=s.bothIssue;tr.append(cell(s.name,'student-name'));const e=s.extremum,l=s.lhopital;for(const v of e?[e.pre,join(e.errorNames),e.post,join(e.weakNodeNames)]:['未完成','未完成','未完成','未完成'])tr.append(cell(v,'wrap'));for(const v of l?[l.pre,l.canCalculateCannotJudge===null?'不计入':l.canCalculateCannotJudge?'是':'否',join(l.errorNames),l.post]:['未完成','未完成','未完成','未完成'])tr.append(cell(v,'wrap'));tr.append(cell(e?e.releaseErrors:'未完成',e?'warm-text':''),trapCell(l),cell(s.bothIssue?'是':'否',s.bothIssue?'warm-text':''));return tr;},'cross');
 const group=el('tr');for(const [text,span] of [['学生',1],['最值判断',4],['洛必达法则',4],['条件误判',2],['共同关注',1]]){const th=el('th','',text);th.colSpan=span;th.scope='colgroup';group.append(th);}tableWrap.querySelector('thead').prepend(group);c.append(tableWrap);c.append(note('未署名记录各自保留，不参与跨模块匹配。“不计入”表示前测非 7 题或缺少可用前测。'));parent.append(c);const exp=section('导出'),b=el('button','','下载跨模块 CSV'),status=el('p','live-status');status.setAttribute('role','status');b.addEventListener('click',()=>{download(API.crossCSV(cross,crossRows()),'班级学情-学生总览.csv');status.textContent='跨模块 CSV 已生成（包含当前筛选及排序结果）。';});add(exp,b,status);parent.append(exp);
}
function render(){if(!model)return;$('module-panel').replaceChildren();for(const t of document.querySelectorAll('[data-tab]')){const selected=t.dataset.tab===active;t.setAttribute('aria-selected',selected);t.tabIndex=selected?0:-1;} $('module-panel').setAttribute('aria-labelledby','tab-'+active);$('demo-badge').hidden=!isDemo;if(active==='cross')renderCross();else renderModule(model.modules[active]);}
function run(demo=false){setInputCollapsed(true);isDemo=demo;model=API.analyze($('source').value);filters={extremum:'',lhopital:''};onlyIssues=false;$('results').hidden=false;$('intro').hidden=true;$('stale').hidden=true;const p=model.parsed;$('input-status').textContent=`已汇总 ${p.records.length} 条有效记录；${p.invalid.length} 条无效行；已去除重复行 ${p.duplicates} 条。`+(p.anonymousCount?`有 ${p.anonymousCount} 条记录未填写姓名或学号。`:'');if(!model.modules[active]?.rounds&&active!=='cross')active=model.modules.extremum.rounds?'extremum':model.modules.lhopital.rounds?'lhopital':'extremum';render();}
function setInputCollapsed(collapsed){$('source').hidden=collapsed;$('input-panel').className='panel input-panel'+(collapsed?' compact':'');$('edit-input').hidden=false;$('edit-input').textContent=collapsed?'展开输入':'收起输入';$('edit-input').setAttribute('aria-expanded',!collapsed);}
$('edit-input').addEventListener('click',()=>{const expand=$('source').hidden;setInputCollapsed(!expand);if(expand)$('source').focus();});
$('analyze').addEventListener('click',()=>run(isDemo));$('sample').addEventListener('click',()=>{$('source').value=window.TEACHER_SAMPLE_TEXT;active='extremum';run(true);});$('clear').addEventListener('click',()=>{$('source').value='';setInputCollapsed(false);$('edit-input').hidden=true;model=null;isDemo=false;$('results').hidden=true;$('intro').hidden=false;$('demo-badge').hidden=true;$('module-panel').replaceChildren();$('input-status').textContent='已清空输入和统计结果。';$('source').focus();});$('source').addEventListener('input',()=>{isDemo=false;$('demo-badge').hidden=true;$('stale').hidden=!model;$('input-status').textContent='输入已更新，点击“开始汇总”后查看。';});
for(const t of document.querySelectorAll('[data-tab]')){t.addEventListener('click',()=>{active=t.dataset.tab;render();});t.addEventListener('keydown',event=>{const tabs=[...document.querySelectorAll('[data-tab]')],i=tabs.indexOf(t);let next=null;if(event.key==='ArrowRight')next=(i+1)%tabs.length;if(event.key==='ArrowLeft')next=(i+tabs.length-1)%tabs.length;if(event.key==='Home')next=0;if(event.key==='End')next=tabs.length-1;if(next!==null){event.preventDefault();active=tabs[next].dataset.tab;render();tabs[next].focus();}});}
})();
